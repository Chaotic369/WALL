<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Habit Loop Quotes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }
        
        .container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }
        
        .quote-card {
            display: none;
            text-align: center;
            max-width: 90%;
            animation: fadeIn 0.5s ease-in;
        }
        
        .quote-card.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        
        .quote-text {
            font-size: 32px;
            font-weight: 700;
            line-height: 1.3;
            color: #00ff88;
            letter-spacing: -0.5px;
        }
        
        .quote-category {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #666;
            font-weight: 600;
        }
        
        .controls {
            position: fixed;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 0 20px;
        }
        
        .btn {
            width: 44px;
            height: 44px;
            border: 2px solid #00ff88;
            background: transparent;
            color: #00ff88;
            font-size: 20px;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .btn:active {
            background: #00ff88;
            color: #000;
        }
        
        .counter {
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 12px;
            color: #666;
            font-weight: 600;
        }
        
        @media (max-width: 600px) {
            .quote-text {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="quoteContainer"></div>
    </div>
    
    <div class="counter">
        <span id="current">1</span> / <span id="total">12</span>
    </div>
    
    <div class="controls">
        <button class="btn" onclick="prevQuote()">←</button>
        <button class="btn" onclick="nextQuote()">→</button>
    </div>
    
    <script>
        const quotes = [
            {
                text: "Your brain rewired itself through repetition.",
                category: "The Feedback Loop"
            },
            {
                text: "Each cycle makes the habit deeper. Each cycle makes it harder to break.",
                category: "The Feedback Loop"
            },
            {
                text: "Not because you want them to. Not because you're undisciplined.",
                category: "Why It Happens"
            },
            {
                text: "Your conscious mind can override your habits maybe 10% of the time.",
                category: "Willpower Myth"
            },
            {
                text: "When stressed, tired, anxious, bored—your prefrontal cortex is offline.",
                category: "The 90%"
            },
            {
                text: "You cannot willpower your way out of a neurological habit. Period.",
                category: "Hard Truth"
            },
            {
                text: "Don't try to resist the cue—eliminate it.",
                category: "Break the Cue"
            },
            {
                text: "Sit with the discomfort. Let the craving peak and pass.",
                category: "Break the Craving"
            },
            {
                text: "Make the action physically harder than the relief it provides.",
                category: "Break the Response"
            },
            {
                text: "Make the consequences more real than the temporary relief.",
                category: "Break the Reward"
            },
            {
                text: "Pick one. Break one link.",
                category: "The Solution"
            },
            {
                text: "The entire chain collapses.",
                category: "The Result"
            }
        ];
        
        let currentIndex = 0;
        
        function renderQuote() {
            const container = document.getElementById('quoteContainer');
            container.innerHTML = '';
            
            const quote = quotes[currentIndex];
            const card = document.createElement('div');
            card.className = 'quote-card active';
            card.innerHTML = `
                <div class="quote-category">${quote.category}</div>
                <div class="quote-text">"${quote.text}"</div>
            `;
            container.appendChild(card);
            
            document.getElementById('current').textContent = currentIndex + 1;
            document.getElementById('total').textContent = quotes.length;
        }
        
        function nextQuote() {
            currentIndex = (currentIndex + 1) % quotes.length;
            renderQuote();
        }
        
        function prevQuote() {
            currentIndex = (currentIndex - 1 + quotes.length) % quotes.length;
            renderQuote();
        }
        
        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextQuote();
            if (e.key === 'ArrowLeft') prevQuote();
        });
        
        renderQuote();
    </script>
</body>
</html>
