<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Loop Hierarchy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
        }
        
        svg {
            width: 100%;
            height: 100%;
            max-width: 900px;
            max-height: 1200px;
        }
    </style>
</head>
<body>
    <svg viewBox="0 0 800 1400" preserveAspectRatio="xMidYMid meet">
        <defs>
            <marker id="arrowdown" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                <polygon points="0 0, 10 5, 0 10" fill="#00ff88"/>
            </marker>
        </defs>
        
        <!-- Background -->
        <rect width="800" height="1400" fill="#000"/>
        
        <!-- LEVEL 1: THE PROBLEM -->
        <text x="400" y="40" font-size="16" font-weight="bold" fill="#666" text-anchor="middle" letter-spacing="2">THE PROBLEM</text>
        
        <rect x="150" y="60" width="500" height="100" fill="#0a0a0a" stroke="#ff6b9d" stroke-width="2" rx="8"/>
        <text x="400" y="95" font-size="18" font-weight="bold" fill="#ff6b9d" text-anchor="middle">Your brain rewired itself</text>
        <text x="400" y="120" font-size="18" font-weight="bold" fill="#ff6b9d" text-anchor="middle">through repetition.</text>
        <text x="400" y="150" font-size="13" fill="#999" text-anchor="middle">Each cycle makes it deeper.</text>
        
        <!-- Arrow down -->
        <path d="M 400 160 L 400 200" stroke="#00ff88" stroke-width="2" marker-end="url(#arrowdown)"/>
        
        <!-- LEVEL 2: WHY -->
        <text x="400" y="230" font-size="16" font-weight="bold" fill="#666" text-anchor="middle" letter-spacing="2">WHY IT HAPPENS</text>
        
        <rect x="150" y="250" width="500" height="80" fill="#0a0a0a" stroke="#ff6b9d" stroke-width="2" rx="8"/>
        <text x="400" y="280" font-size="17" font-weight="bold" fill="#ff6b9d" text-anchor="middle">Not because you want them to.</text>
        <text x="400" y="310" font-size="17" font-weight="bold" fill="#ff6b9d" text-anchor="middle">Not because you're undisciplined.</text>
        
        <!-- Arrow down -->
        <path d="M 400 330 L 400 370" stroke="#00ff88" stroke-width="2" marker-end="url(#arrowdown)"/>
        
        <!-- LEVEL 3: THE TRUTH -->
        <text x="400" y="400" font-size="16" font-weight="bold" fill="#666" text-anchor="middle" letter-spacing="2">THE HARD TRUTH</text>
        
        <rect x="100" y="420" width="300" height="90" fill="#0a0a0a" stroke="#ff6b9d" stroke-width="2" rx="8"/>
        <text x="250" y="450" font-size="15" font-weight="bold" fill="#ff6b9d" text-anchor="middle">Your conscious mind</text>
        <text x="250" y="475" font-size="15" font-weight="bold" fill="#ff6b9d" text-anchor="middle">can override 10%</text>
        <text x="250" y="500" font-size="15" font-weight="bold" fill="#ff6b9d" text-anchor="middle">of the time.</text>
        
        <rect x="400" y="420" width="300" height="90" fill="#0a0a0a" stroke="#ff6b9d" stroke-width="2" rx="8"/>
        <text x="550" y="450" font-size="15" font-weight="bold" fill="#ff6b9d" text-anchor="middle">The other 90%—</text>
        <text x="550" y="475" font-size="15" font-weight="bold" fill="#ff6b9d" text-anchor="middle">your prefrontal</text>
        <text x="550" y="500" font-size="15" font-weight="bold" fill="#ff6b9d" text-anchor="middle">cortex is offline.</text>
        
        <!-- Converging arrows -->
        <path d="M 250 510 L 400 550" stroke="#00ff88" stroke-width="2" marker-end="url(#arrowdown)"/>
        <path d="M 550 510 L 400 550" stroke="#00ff88" stroke-width="2" marker-end="url(#arrowdown)"/>
        
        <!-- LEVEL 4: THE VERDICT -->
        <rect x="100" y="550" width="600" height="90" fill="#0a0a0a" stroke="#ff0055" stroke-width="3" rx="8"/>
        <text x="400" y="585" font-size="20" font-weight="bold" fill="#ff0055" text-anchor="middle">You cannot willpower your way</text>
        <text x="400" y="615" font-size="20" font-weight="bold" fill="#ff0055" text-anchor="middle">out of a neurological habit.</text>
        <text x="400" y="640" font-size="20" font-weight="bold" fill="#ff0055" text-anchor="middle">Period.</text>
        
        <!-- Arrow down -->
        <path d="M 400 640 L 400 690" stroke="#00ff88" stroke-width="3" marker-end="url(#arrowdown)"/>
        
        <!-- LEVEL 5: THE SOLUTION -->
        <text x="400" y="730" font-size="16" font-weight="bold" fill="#666" text-anchor="middle" letter-spacing="2">BREAK THE LOOP</text>
        
        <!-- 4 boxes -->
        <rect x="50" y="750" width="150" height="140" fill="#0a0a0a" stroke="#00ff88" stroke-width="2" rx="8"/>
        <text x="125" y="780" font-size="14" font-weight="bold" fill="#00ff88" text-anchor="middle">BREAK</text>
        <text x="125" y="800" font-size="14" font-weight="bold" fill="#00ff88" text-anchor="middle">THE CUE</text>
        <text x="125" y="830" font-size="12" fill="#999" text-anchor="middle" font-style="italic">Don't resist—</text>
        <text x="125" y="850" font-size="12" fill="#999" text-anchor="middle" font-style="italic">eliminate it.</text>
        
        <rect x="225" y="750" width="150" height="140" fill="#0a0a0a" stroke="#00ff88" stroke-width="2" rx="8"/>
        <text x="300" y="780" font-size="14" font-weight="bold" fill="#00ff88" text-anchor="middle">BREAK</text>
        <text x="300" y="800" font-size="14" font-weight="bold" fill="#00ff88" text-anchor="middle">THE CRAVING</text>
        <text x="300" y="830" font-size="12" fill="#999" text-anchor="middle" font-style="italic">Sit with it.</text>
        <text x="300" y="850" font-size="12" fill="#999" text-anchor="middle" font-style="italic">Let it pass.</text>
        
        <rect x="400" y="750" width="150" height="140" fill="#0a0a0a" stroke="#00ff88" stroke-width="2" rx="8"/>
        <text x="475" y="780" font-size="14" font-weight="bold" fill="#00ff88" text-anchor="middle">BREAK</text>
        <text x="475" y="800" font-size="14" font-weight="bold" fill="#00ff88" text-anchor="middle">THE RESPONSE</text>
        <text x="475" y="830" font-size="12" fill="#999" text-anchor="middle" font-style="italic">Make it</text>
        <text x="475" y="850" font-size="12" fill="#999" text-anchor="middle" font-style="italic">difficult.</text>
        
        <rect x="575" y="750" width="150" height="140" fill="#0a0a0a" stroke="#00ff88" stroke-width="2" rx="8"/>
        <text x="650" y="780" font-size="14" font-weight="bold" fill="#00ff88" text-anchor="middle">BREAK</text>
        <text x="650" y="800" font-size="14" font-weight="bold" fill="#00ff88" text-anchor="middle">THE REWARD</text>
        <text x="650" y="830" font-size="12" fill="#999" text-anchor="middle" font-style="italic">Make</text>
        <text x="650" y="850" font-size="12" fill="#999" text-anchor="middle" font-style="italic">consequences real.</text>
        
        <!-- Arrows from verdict to boxes -->
        <path d="M 250 900 L 250 920" stroke="#00ff88" stroke-width="2" marker-end="url(#arrowdown)"/>
        
        <!-- Center divider line -->
        <line x1="400" y1="750" x2="400" y2="900" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="5,5"/>
        
        <!-- LEVEL 6: THE CHOICE -->
        <text x="400" y="960" font-size="16" font-weight="bold" fill="#666" text-anchor="middle" letter-spacing="2">PICK ONE</text>
        
        <rect x="200" y="980" width="400" height="80" fill="#0a0a0a" stroke="#00ff88" stroke-width="2" rx="8"/>
        <text x="400" y="1015" font-size="18" font-weight="bold" fill="#00ff88" text-anchor="middle">Break one link.</text>
        <text x="400" y="1045" font-size="16" fill="#999" text-anchor="middle">Pick any one and interrupt the cycle.</text>
        
        <!-- Arrow down -->
        <path d="M 400 1060 L 400 1100" stroke="#00ff88" stroke-width="3" marker-end="url(#arrowdown)"/>
        
        <!-- LEVEL 7: THE RESULT -->
        <rect x="150" y="1100" width="500" height="100" fill="#0a0a0a" stroke="#00ff88" stroke-width="3" rx="8"/>
        <text x="400" y="1145" font-size="22" font-weight="bold" fill="#00ff88" text-anchor="middle">The entire chain</text>
        <text x="400" y="1175" font-size="22" font-weight="bold" fill="#00ff88" text-anchor="middle">collapses.</text>
        
    </svg>
</body>
</html>
