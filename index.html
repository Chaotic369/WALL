<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Habit Loop Diagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        svg {
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100vh;
        }
    </style>
</head>
<body>
    <svg viewBox="0 0 600 700" preserveAspectRatio="xMidYMid meet">
        <defs>
            <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                <polygon points="0 0, 10 3, 0 6" fill="#00ff88"/>
            </marker>
        </defs>
        
        <!-- Background -->
        <rect width="600" height="700" fill="#000"/>
        
        <!-- Stage 1: CUE (Top) -->
        <rect x="175" y="30" width="250" height="90" fill="#0a0a0a" stroke="#00ff88" stroke-width="2" rx="8"/>
        <text x="300" y="60" font-size="20" font-weight="bold" fill="#00ff88" text-anchor="middle">1. CUE</text>
        <text x="300" y="85" font-size="12" fill="#aaa" text-anchor="middle">Make it Invisible</text>
        
        <!-- Arrow 1 to 2 -->
        <path d="M 300 120 L 300 160" stroke="#00ff88" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
        
        <!-- Stage 2: CRAVING (Right) -->
        <rect x="380" y="160" width="180" height="90" fill="#0a0a0a" stroke="#00ff88" stroke-width="2" rx="8"/>
        <text x="470" y="190" font-size="20" font-weight="bold" fill="#00ff88" text-anchor="middle">2. CRAVING</text>
        <text x="470" y="215" font-size="12" fill="#aaa" text-anchor="middle">Redefine It</text>
        
        <!-- Arrow 2 to 3 -->
        <path d="M 470 250 Q 470 330 380 370" stroke="#00ff88" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
        
        <!-- Stage 3: RESPONSE (Bottom Right) -->
        <rect x="200" y="370" width="180" height="90" fill="#0a0a0a" stroke="#00ff88" stroke-width="2" rx="8"/>
        <text x="290" y="400" font-size="20" font-weight="bold" fill="#00ff88" text-anchor="middle">3. RESPONSE</text>
        <text x="290" y="425" font-size="12" fill="#aaa" text-anchor="middle">Make it Difficult</text>
        
        <!-- Arrow 3 to 4 -->
        <path d="M 200 415 L 140 415" stroke="#00ff88" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
        
        <!-- Stage 4: REWARD (Left) -->
        <rect x="40" y="370" width="100" height="90" fill="#0a0a0a" stroke="#00ff88" stroke-width="2" rx="8"/>
        <text x="90" y="400" font-size="18" font-weight="bold" fill="#00ff88" text-anchor="middle">4.</text>
        <text x="90" y="422" font-size="14" font-weight="bold" fill="#00ff88" text-anchor="middle">REWARD</text>
        <text x="90" y="440" font-size="10" fill="#aaa" text-anchor="middle">Unsatisfying</text>
        
        <!-- Arrow 4 back to 1 (Feedback Loop) -->
        <path d="M 90 370 Q 90 200 175 75" stroke="#ff6b9d" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
        <polygon points="0 0, 10 3, 0 6" fill="#ff6b9d" transform="translate(175 75)"/>
        
        <!-- Center label -->
        <circle cx="300" cy="380" r="80" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3,3"/>
        <text x="300" y="380" font-size="13" fill="#666" text-anchor="middle" dominant-baseline="middle">BREAK</text>
        <text x="300" y="397" font-size="13" fill="#666" text-anchor="middle" dominant-baseline="middle">THE LOOP</text>
    </svg>
</body>
</html>
