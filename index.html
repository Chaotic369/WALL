            width: 100%;
            height: 30px;
            border: none;
            cursor: pointer;
            border-radius: 4px;

        .control-group input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

            width: 100%;
            padding: 4px;
            background: #1a1a1a;
            border: 1px solid #00ff88;
            color: #00ff88;
            border-radius: 4px;
        }

            width: 100%;
            padding: 10px;
            background: #ff6b9d;
            border: none;
            color: #000;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;

        #saveBtn:hover {
            background: #ff8ab8;
        }

            max-width: 100vw;
            max-height: 100vh;
            width: 100%;
            height: 100%;

            fill: #1a1a1a;
            stroke: #00ff88;
            stroke-width: 2;
        }
        
        .stage-title {
            font-size: 18px;
            font-weight: bold;
            fill: #00ff88;
            text-anchor: middle;
        }
        
        .stage-desc {
            font-size: 12px;
            fill: #aaa;
            text-anchor: middle;
        }
        
        .fix-text {
            font-size: 11px;
            fill: #ff6b9d;
            text-anchor: middle;
            font-weight: bold;
        }
        
        .brain-text {
            font-size: 10px;
            fill: #888;
            text-anchor: middle;
            font-style: italic;
        }
        
        .arrow {
            stroke: #00ff88;
            stroke-width: 2;
            fill: none;
            marker-end: url(#arrowhead);
        }
        
        .feedback-arrow {
            stroke: #ff6b9d;
            stroke-width: 2;
            fill: none;
            stroke-dasharray: 5,5;
            marker-end: url(#arrowhead-pink);
        }
        
        .title {
            font-size: 28px;
            font-weight: bold;
            fill: #00ff88;
            text-anchor: middle;
        }
        
        .subtitle {
            font-size: 14px;
            fill: #666;
            text-anchor: middle;
        }
    </style>

                box.setAttribute('rx', controls.cornerRadius.value);
            });

            document.querySelectorAll('.arrow').forEach(arrow => {
                arrow.setAttribute('stroke', controls.arrowColor.value);
                arrow.setAttribute('marker-end', `url(#arrowhead)`);

                arrow.setAttribute('stroke', controls.accentColor.value);
                arrow.setAttribute('marker-end', `url(#arrowhead-pink)`);
            });

            document.querySelectorAll('.stage-title, .title').forEach(title => {
                title.setAttribute('fill', controls.titleColor.value);
            });

            document.querySelectorAll('.fix-text').forEach(text => {
                text.setAttribute('fill', controls.accentColor.value);
            });

            document.getElementById('bgRect').setAttribute('fill', controls.bgColor.value);

            document.getElementById('arrowhead').querySelector('polygon').setAttribute('fill', controls.arrowColor.value);
            document.getElementById('arrowhead-pink').querySelector('polygon').setAttribute('fill', controls.accentColor.value);

            document.getElementById('cornerValue').textContent = controls.cornerRadius.value + 'px';

        controls.boxFill.addEventListener('change', updateTheme);
        controls.boxStroke.addEventListener('change', updateTheme);
        controls.arrowColor.addEventListener('change', updateTheme);
        controls.accentColor.addEventListener('change', updateTheme);
        controls.titleColor.addEventListener('change', updateTheme);
        controls.cornerRadius.addEventListener('input', updateTheme);
        controls.bgColor.addEventListener('change', updateTheme);

        controls.saveBtn.addEventListener('click', async function() {
            const svgData = new XMLSerializer().serializeToString(svg);
            const canvas = document.createElement('canvas');
            canvas.width = 2800;
            canvas.height = 1800;
            const ctx = canvas.getContext('2d');

            const img = new Image();
            img.onload = function() {
                ctx.drawImage(img, 0, 0, 2800, 1800);
                const link = document.createElement('a');
                link.href = canvas.toDataURL('image/png', 1.0);
                link.download = 'habit-loop-diagram.png';
                link.click();
            };

            img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
        });
    </script>
